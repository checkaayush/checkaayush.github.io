name: Build resume

on:
  push:
    branches: [master]
    paths: ['resume/AayushSarva.tex']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-resume
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - name: Build PDF
        run: |
          mkdir -p build
          tectonic -X compile resume/AayushSarva.tex --outdir build
          cp build/AayushSarva.pdf Resume_AayushSarva.pdf
      - name: Commit PDF and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add Resume_AayushSarva.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build resume from ${GITHUB_SHA::7}"
          git push
          # Pushes made with GITHUB_TOKEN may not trigger a Pages build on their own
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
